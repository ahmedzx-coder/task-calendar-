name: Natija Android APK (test)

on:
  push:
    branches:
      - android-apk-test
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk-test.yml'
      - 'index.html'
      - 'cloud.js'
      - 'firebase-config.js'
      - 'onboarding.js'
      - 'onboarding.css'
      - 'icons/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout test branch (no changes to web)
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Use preinstalled Android SDK on GitHub hosted runner
        run: |
          test -n "${ANDROID_HOME}"
          test -d "${ANDROID_HOME}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Package Natija offline assets
        run: |
          npm run prepare:web
          node --check www/cloud.js
          node --check www/onboarding.js

      - name: Generate Android project
        run: npx cap add android

      - name: Add Natija launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp ../icons/icon-512.png android/app/src/main/res/drawable/natija_launcher.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          source=p.read_text()
          source=source.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/natija_launcher"')
          source=source.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/natija_launcher"')
          p.write_text(source)
          PY

      - name: Sync offline web assets
        run: npx cap sync android

      - name: Build signed-for-debug Android APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Natija-debug.apk

      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Natija-Android-debug-APK
          path: android-app/Natija-debug.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
