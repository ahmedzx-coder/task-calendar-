name: Check Natija JavaScript

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'cloud.js'
      - 'natija-v2.js'
      - 'natija-model.js'
      - 'tests/**'
      - 'sw.js'
      - 'onboarding.js'
      - 'onboarding.css'
      - 'scripts/**'
      - 'functions/**'
      - '.github/workflows/check-javascript.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript files
        run: |
          node --check cloud.js
          node --check natija-v2.js
          node --check natija-model.js
          node --check onboarding.js
          for file in scripts/*.js functions/*.js; do
            node --check "$file"
          done
      - name: Test live-saving tasks and projects
        run: |
          npm install --no-save --no-audit --no-fund jsdom@26.1.0
          node tests/live-save-smoke.cjs
          node tests/back-navigation.test.cjs
      - name: Check inline app JavaScript
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const pattern = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
          let count = 0;
          for (const match of html.matchAll(pattern)) {
            if (/\bsrc\s*=/.test(match[1]) || /application\/ld\+json/i.test(match[1])) continue;
            new vm.Script(match[2], { filename: 'index.inline.' + (++count) + '.js' });
          }
          if (!count) throw new Error('No application inline JavaScript found');
          console.log('Checked ' + count + ' inline application scripts');
          NODE
      - name: Validate onboarding wiring
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('index.html', 'utf8');
          const cloud = fs.readFileSync('cloud.js', 'utf8');
          const tour = fs.readFileSync('onboarding.js', 'utf8');
          assert.match(html, /id="startTourBtn"/);
          assert.match(html, /onboarding\.js\?v=1/);
          assert.match(html, /onboarding\.css\?v=1/);
          assert.match(cloud, /NatijaTour\.maybeStart/);
          assert.match(cloud, /onboardingVersion: 1/);
          assert.match(tour, /window\.NatijaTour/);
          assert.match(tour, /natija-onboarding-completed/);
          console.log('Onboarding registration, sync and replay are wired');
          NODE
