name: Task Reminders

on:
  schedule:
    # كل 5 دقائق (أقل تكرار يسمح به GitHub). قد يتأخر التنفيذ عدة دقائق وقت الزحمة.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # للتشغيل اليدوي من تبويب Actions (للاختبار)

permissions:
  contents: read

concurrency:
  group: task-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Send due reminders
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node send-reminders.js

      - name: Send Telegram reminders and process account links
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node telegram-reminders.js
